name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/amd64
            artifact: easyscan-darwin-amd64
            tags: ""
          - os: macos-latest
            platform: darwin/arm64
            artifact: easyscan-darwin-arm64
            tags: ""
          - os: windows-latest
            platform: windows/amd64
            artifact: easyscan-windows-amd64
            tags: ""
          - os: windows-latest
            platform: windows/arm64
            artifact: easyscan-windows-arm64
            tags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: easyscan-linux-amd64
            tags: "webkit2_41"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies (GTK / WebKit / libpcap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libpcap-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build (${{ matrix.platform }})
        shell: bash
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            wails build -platform ${{ matrix.platform }} -tags ${{ matrix.tags }}
          else
            wails build -platform ${{ matrix.platform }}
          fi

      - name: Rename Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv build/bin/easyscan.exe build/bin/${{ matrix.artifact }}.exe

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ${{ matrix.artifact }}.zip easyscan.app

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar -czf ${{ matrix.artifact }}.tar.gz easyscan

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.zip
            build/bin/*.tar.gz
            build/bin/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
