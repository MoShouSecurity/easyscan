<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Easy Scan</title>
<style>
  :root {
    --bg: #0F1423; --panel: #131824; --panel-2: #1C2938; --border: #2B333E;
    --text: #EEF7F2; --muted: #8FB2C9; --accent: #1E9EB3; --accent-2: #29B7CB;
    --ok: #20A162; --warn: #E5B751; --err: #EE4863;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 13px; overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-size: 17px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .logo .sub { color: var(--muted); font-size: 11px; font-weight: 400; }
  .search-box { flex: 1; display: flex; gap: 8px; max-width: 520px; }
  .search-box input { flex: 1; padding: 7px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; border: none; border-radius: 6px; font-size: 13px; }
  button.ghost { background: var(--panel-2); color: var(--text); padding: 7px 14px; border: 1px solid var(--border); }
  button.ghost:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #062031; padding: 7px 16px; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { background: var(--panel-2); color: var(--err); padding: 7px 14px; border: 1px solid var(--err); }

  /* 内容区 */
  .content { flex: 1; overflow-y: auto; padding: 18px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title:first-child { margin-top: 0; }
  .count { background: var(--panel-2); color: var(--accent); padding: 1px 8px; border-radius: 10px; font-size: 11px; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--panel-2); }
  td { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(30,158,179,.06); }
  td .target { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; color: var(--accent); font-weight: 600; }

  /* 徽章 / 进度条 */
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-family: inherit; white-space: nowrap; }
  .b-running { background: rgba(30,158,179,.15); color: var(--accent); }
  .b-finished { background: rgba(32,161,98,.15); color: var(--ok); }
  .b-failed { background: rgba(238,72,99,.15); color: var(--err); }
  .b-pending { background: rgba(229,183,81,.15); color: var(--warn); }
  .b-paused { background: rgba(139,92,246,.15); color: #a78bfa; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 90px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
  .tag { color: var(--accent-2); }
  .empty { color: var(--muted); text-align: center; padding: 40px; }

  /* 详情页标签页 */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab { padding: 8px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count { color: var(--muted); }
  .tab.active .count { color: var(--accent); }

  /* 网站卡片 */
  .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .site-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .site-card .thumb { height: 150px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .site-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .site-card .thumb .ph { color: var(--muted); font-size: 12px; }
  .site-card .meta { padding: 10px 12px; }
  .site-card .url { font-family: "SF Mono", monospace; font-size: 12px; color: var(--accent); word-break: break-all; margin-bottom: 4px; }
  .site-card .title { font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .site-card .fp { font-size: 11px; color: var(--muted); }

  /* 模态框 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 460px; max-width: 92vw; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  label { display: block; color: var(--muted); margin: 12px 0 4px; font-size: 12px; }
  input[type=text], select { width: 100%; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 12px; }
  .check { display: flex; align-items: center; gap: 7px; color: var(--text); font-size: 12px; }
  .check input { accent-color: var(--accent); }
  .modal .actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal .actions button { flex: 1; padding: 9px; }

  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none; z-index: 200; max-width: 420px; word-break: break-all; }
  .back-link { cursor: pointer; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">Easy Scan</span>
  <button class="ghost" id="backBtn" style="display:none" onclick="goHome()">← 返回</button>
  <div class="search-box" id="searchBox">
    <input id="searchInput" type="text" placeholder="搜索域名 / IP / 标题 / URL / 指纹…" onkeydown="if(event.key==='Enter')doSearch()" />
    <button class="ghost" onclick="doSearch()">搜索</button>
  </div>
  <span style="flex:1"></span>
  <button class="ghost" id="cfgBtn" onclick="openConfig()">⚙ 配置</button>
  <button class="primary" id="addBtn" onclick="openAddTask()">＋ 添加任务</button>
  <button class="primary" id="exportBtn" style="display:none" onclick="exportCurrent()">导出 CSV</button>
</div>

<div class="content" id="view"></div>

<!-- 添加任务模态框 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <h2>新建侦察任务</h2>
    <label>目标（支持多个，每行一个；域名拆多个任务，IP 合并一个任务）</label>
    <textarea id="mTarget" rows="3" placeholder="example.com&#10;1.2.3.0/24" oninput="updateTypeHint()" style="resize:vertical"></textarea>
    <div id="typeHint" style="font-size:11px;color:var(--accent);margin-top:4px;display:none"></div>
    <label>端口模式</label>
    <select id="mPort" onchange="togglePortSpec()"><option value="test">测试（6端口）</option><option value="top100">Top 100</option><option value="top1000" selected>Top 1000</option><option value="all">全部端口</option><option value="custom">自定义端口</option></select>
    <div id="mPortSpecWrap" style="display:none">
      <label>自定义端口（范围语法，如 1-1000,8080,9000-9100）</label>
      <input type="text" id="mPortSpec" placeholder="如 1-1000,8080,9000-9100" />
    </div>
    <div class="opts">
      <div class="check"><input type="checkbox" id="mBrute" checked /><span>子域名爆破</span></div>
      <div class="check"><input type="checkbox" id="mNoPing" /><span>目标禁 ping（跳过存活确认）</span></div>
      <div class="check"><input type="checkbox" id="mNuclei" /><span>nuclei POC 检测</span></div>
      <div class="check"><input type="checkbox" id="mLeak" /><span>文件泄漏检测</span></div>
      <div class="check"><input type="checkbox" id="mShot" checked /><span>站点截图</span></div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="closeAddTask()">取消</button>
      <button class="primary" id="mSubmit" onclick="submitTask()">开始侦察</button>
    </div>
  </div>
</div>

<!-- 配置模态框 -->
<div class="modal-mask" id="configModal">
  <div class="modal">
    <h2>全局配置</h2>
    <label>文件泄漏字典文件（留空用内置字典）</label>
    <input type="text" id="cfgLeakDict" placeholder="/path/to/leak-dict.txt" />
    <label>nuclei 模板目录（留空用内置模板）</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="cfgTemplatesDir" placeholder="/path/to/nuclei-templates" style="flex:1" />
      <button class="ghost" onclick="downloadNuclei(this)">下载官方模板库</button>
    </div>
    <div class="check"><input type="checkbox" id="cfgNucleiAuto" /><span>自动下载官方模板库</span></div>
    <label>nuclei 模板库地址</label>
    <input type="text" id="cfgNucleiRepo" placeholder="https://github.com/projectdiscovery/nuclei-templates.git" />
    <label>subfinder provider-config（填 API key）</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="cfgSubfinderConfig" placeholder="留空则自动生成到配置目录" style="flex:1" />
      <button class="ghost" onclick="openSubfinderConfig()">打开/生成</button>
    </div>
    <div class="row">
      <div><label>并发度</label><input type="text" id="cfgConcurrency" /></div>
      <div><label>超时（秒）</label><input type="text" id="cfgTimeout" /></div>
    </div>
    <div class="row">
      <div><label>默认端口模式</label>
        <select id="cfgPortMode" onchange="toggleCfgPortSpec()"><option value="test">测试（6端口）</option><option value="top100">Top 100</option><option value="top1000">Top 1000</option><option value="all">全部端口</option><option value="custom">自定义端口</option></select>
        <div id="cfgPortSpecWrap" style="display:none;margin-top:6px">
          <label>默认自定义端口</label>
          <input type="text" id="cfgPortSpec" placeholder="如 1-1000,8080" style="width:100%" />
        </div>
      </div>
      <div><label>Chrome 路径</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="cfgChrome" placeholder="留空自动探测" style="flex:1" />
          <button class="ghost" style="padding:7px 10px" onclick="detectChrome()">探测</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div><label>nmap 路径</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="cfgNmap" placeholder="留空自动探测" style="flex:1" />
          <button class="ghost" style="padding:7px 10px" onclick="detectNmap()">探测</button>
        </div>
      </div>
      <div><label>masscan 路径</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="cfgMasscan" placeholder="留空自动探测" style="flex:1" />
          <button class="ghost" style="padding:7px 10px" onclick="detectMasscan()">探测</button>
        </div>
      </div>
    </div>
    <label>HTTP 代理（如 http://127.0.0.1:7890）</label>
    <input type="text" id="cfgProxy" placeholder="留空则不使用代理" />
    <div style="margin-top:12px;color:var(--muted);font-size:11px;word-break:break-all">配置文件：<span id="cfgPath"></span></div>
    <div class="actions">
      <button class="ghost" onclick="closeConfig()">取消</button>
      <button class="primary" onclick="saveConfig()">保存配置</button>
    </div>
  </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal-mask" id="deleteModal">
  <div class="modal" style="width:380px">
    <h2>删除任务</h2>
    <p style="color:var(--muted);margin-bottom:8px;line-height:1.6">确定删除该任务及其端口 / 站点 / 泄露记录？<br>子域名将保留（仅解绑）。此操作不可撤销。</p>
    <div class="actions">
      <button class="ghost" onclick="cancelDelete()">取消</button>
      <button class="primary" style="background:linear-gradient(135deg,var(--err),#B93A4C)" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- 关闭确认模态框 -->
<div class="modal-mask" id="closeModal">
  <div class="modal" style="width:380px">
    <h2>任务进行中</h2>
    <p style="color:var(--muted);margin-bottom:8px;line-height:1.6">还有任务正在进行，关闭软件将中断这些任务。<br>确定要退出吗？</p>
    <div class="actions">
      <button class="ghost" onclick="cancelClose()">取消</button>
      <button class="primary" style="background:linear-gradient(135deg,var(--err),#B93A4C)" onclick="confirmClose()">仍要退出</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const go = window.go.main.App;
let state = { view: 'home', taskID: null, search: '' };
let detailTabs = {};
let currentSites = [];
let currentDetailTab = 'sites';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts) { return ts ? new Date(ts*1000).toLocaleString() : '-'; }
function toast(msg, isErr) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; t.style.borderColor = isErr ? 'var(--err)' : 'var(--accent)'; clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 3200); }

const statusBadge = s => ({ running:'<span class="badge b-running">运行中</span>', paused:'<span class="badge b-paused">已暂停</span>', finished:'<span class="badge b-finished">完成</span>', failed:'<span class="badge b-failed">失败</span>', pending:'<span class="badge b-pending">排队中</span>' }[s] || `<span class="badge">${esc(s)}</span>`);

/* ---------- 首页：任务列表 ---------- */
async function renderHome() {
  state.view = 'home';
  setTopbar('home');
  const v = document.getElementById('view');
  let tasks;
  try { tasks = await go.ListTasks(); } catch(e) { return; }
  if (!tasks || !tasks.length) {
    v.innerHTML = '<div class="empty">暂无任务。点击右上角「添加任务」开始侦察你的第一个目标。</div>';
    return;
  }
  v.innerHTML = `<div class="section-title">侦察任务 <span class="count">${tasks.length}</span></div>
  <table><thead><tr><th>目标</th><th>类型</th><th>状态</th><th style="width:180px">进度</th><th>消息</th><th>创建时间</th><th>操作</th></tr></thead><tbody>` +
  tasks.map(t => `<tr class="clickable" onclick="openDetail('${esc(t.id)}')">
    <td class="target">${esc(t.target)}</td>
    <td>${t.type==='ip'?'IP':'域名'}</td>
    <td>${statusBadge(t.status)}</td>
    <td><div class="bar"><div style="width:${t.progress||0}%"></div></div><span style="font-size:11px;color:var(--muted)">${t.progress||0}%</span></td>
    <td class="msg" style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)" title="${esc(t.message)}">${esc(t.message)}</td>
    <td>${fmtTime(t.created_at)}</td>
    <td style="white-space:nowrap">
      ${(t.status === 'running' || t.status === 'pending') ? `<button class="ghost" style="padding:2px 10px;color:var(--warn);font-size:12px;margin-right:6px" onclick="event.stopPropagation(); pauseTask('${esc(t.id)}')">中止</button>` : ''}
      ${t.status === 'paused' ? `<button class="ghost" style="padding:2px 10px;color:var(--ok);font-size:12px;margin-right:6px" onclick="event.stopPropagation(); resumeTask('${esc(t.id)}')">恢复</button>` : ''}
      <button class="ghost" style="padding:2px 10px;color:var(--accent);font-size:12px;margin-right:6px" onclick="event.stopPropagation(); rescanTask('${esc(t.id)}')">重新扫描</button>
      <button class="ghost" style="padding:2px 10px;color:var(--err);font-size:12px" onclick="event.stopPropagation(); delTask('${esc(t.id)}')">删除</button>
    </td>
  </tr>`).join('') + '</tbody></table>';
}

/* ---------- 搜索 ---------- */
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { toast('请输入搜索关键字', true); return; }
  state.view = 'search'; state.search = q;
  setTopbar('search');
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">搜索中…</div>';
  let results;
  try { results = await go.Search(q); } catch(e) { results = []; }
  const typeName = { domain:'根域名', subdomain:'子域名', ip:'IP', port:'端口', site:'站点', leak:'泄露' };
  v.innerHTML = `<div class="section-title">搜索 “${esc(q)}” <span class="count">${results.length} 条结果</span></div>` +
    (results.length ? `<table><thead><tr><th>类型</th><th>值</th><th>详情</th></tr></thead><tbody>` +
    results.map(r => `<tr>
      <td><span class="badge">${typeName[r.type]||r.type}</span></td>
      <td class="target">${esc(r.value)}</td>
      <td style="color:var(--muted)">${esc(r.detail)}</td>
    </tr>`).join('') + '</tbody></table>' : '<div class="empty">未找到匹配资产</div>');
}

/* ---------- 详情页 ---------- */
async function openDetail(taskID) {
  state.view = 'detail'; state.taskID = taskID; state.lastStatus = null;
  currentDetailTab = 'sites';
  setTopbar('detail');
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">加载任务详情…</div>';
  await renderDetail(taskID);
}

async function renderDetail(taskID) {
  const v = document.getElementById('view');
  let task, sites, ports, leaks, subs, ips;
  try {
    [task, sites, ports, leaks, subs, ips] = await Promise.all([
      go.GetTask(taskID), go.ListSitesByTask(taskID), go.ListPortsByTask(taskID), go.ListLeaksByTask(taskID), go.ListSubdomainsByTask(taskID), go.ListIPsByTask(taskID)
    ]);
  } catch(e) {
    v.innerHTML = '<div class="empty">加载详情失败: ' + esc(e) + '</div>';
    return;
  }
  if (!task) { v.innerHTML = '<div class="empty">任务不存在或已删除</div>'; return; }
  sites = sites || []; ports = ports || []; leaks = leaks || []; subs = subs || []; ips = ips || [];

  // 存活 IP 优先用落盘的 ips，兜底从端口/子域名推导（兼容旧任务）。
  const aliveIPs = ips.length
    ? [...new Set(ips.map(i=>i.ip).filter(Boolean))]
    : [...new Set([...ports.map(p=>p.ip), ...subs.map(s=>s.ip)].filter(Boolean))];

  // 缓存各标签页内容。
  currentSites = sites;
  detailTabs = {
    sites: renderSitesHTML(sites),
    ips: renderIPsHTML(aliveIPs, ports),
    ports: renderPortsHTML(ports),
    leaks: renderLeaksHTML(leaks),
  };

  const tabDefs = [
    { key: 'sites', label: '网站', count: sites.length },
    { key: 'ips', label: 'IP存活', count: aliveIPs.length },
    { key: 'ports', label: '端口', count: ports.length },
    { key: 'leaks', label: '敏感信息泄露', count: leaks.length },
  ];

  let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
    <span class="target" style="font-size:16px;font-weight:700;color:var(--text)">${esc(task.target)}</span>
    ${statusBadge(task.status)}
  </div>
  <div style="color:var(--muted);margin-bottom:14px">${esc(task.message)} · 创建于 ${fmtTime(task.created_at)}</div>
  <div class="tabs">${tabDefs.map(t => `<div class="tab" data-dtab="${t.key}" onclick="switchDetailTab('${t.key}')">${t.label} <span class="count">${t.count}</span></div>`).join('')}</div>
  <div id="detailTabContent"></div>`;

  v.innerHTML = html;
  switchDetailTab(currentDetailTab);
}

function renderSitesHTML(sites) {
  if (!sites.length) return '<div class="empty">本任务未发现 Web 站点</div>';
  return '<div class="site-grid">' + sites.map(s => `
    <div class="site-card">
      <div class="thumb" id="thumb-${esc(s.id)}"><span class="ph">无截图</span></div>
      <div class="meta">
        <div class="url" style="cursor:pointer" title="点击用浏览器打开" onclick="openURL('${esc(s.url)}')">${esc(s.url)}</div>
        <div class="title">${esc(s.title) || '（无标题）'}</div>
        <div class="fp">${esc(s.fingerprint)||'—'} · ${esc(s.server)||''} · HTTP ${s.status_code||'?'}</div>
      </div>
    </div>`).join('') + '</div>';
}

function renderIPsHTML(aliveIPs, ports) {
  if (!aliveIPs.length) return '<div class="empty">无存活 IP</div>';
  return `<table><thead><tr><th>IP</th><th>关联端口数</th></tr></thead><tbody>` +
    aliveIPs.map(ip => `<tr><td>${esc(ip)}</td><td>${ports.filter(p=>p.ip===ip).length}</td></tr>`).join('') + '</tbody></table>';
}

function renderPortsHTML(ports) {
  if (!ports.length) return '<div class="empty">无开放端口</div>';
  return `<table><thead><tr><th>IP</th><th>端口</th><th>协议</th><th>服务</th><th>产品/版本</th><th>标题</th></tr></thead><tbody>` +
    ports.map(p => `<tr><td>${esc(p.ip)}</td><td>${p.port}</td><td>${esc(p.protocol)}</td><td class="tag">${esc(p.service)}</td><td>${p.product ? esc(p.product) + (p.version ? ' ' + esc(p.version) : '') : '-'}</td><td style="color:var(--muted)">${esc(p.title)}</td></tr>`).join('') + '</tbody></table>';
}

function renderLeaksHTML(leaks) {
  if (!leaks.length) return '<div class="empty">未发现敏感信息泄露</div>';
  return `<table><thead><tr><th>URL</th><th>类型</th><th>路径</th><th>状态码</th></tr></thead><tbody>` +
    leaks.map(l => `<tr><td class="target">${esc(l.url)}</td><td><span class="badge" style="background:rgba(238,72,99,.15);color:var(--err)">${esc(l.type)}</span></td><td style="color:var(--muted)">${esc(l.path)}</td><td>${l.status_code}</td></tr>`).join('') + '</tbody></table>';
}

function switchDetailTab(key) {
  currentDetailTab = key;
  document.querySelectorAll('.tab[data-dtab]').forEach(t => t.classList.toggle('active', t.dataset.dtab === key));
  const content = document.getElementById('detailTabContent');
  if (!content) return;
  content.innerHTML = detailTabs[key] || '';
  if (key === 'sites') currentSites.filter(s=>s.screenshot).forEach(s => loadThumb(s.id, s.screenshot));
}

const shotCache = {};
function setThumb(siteID, b64) {
  const el = document.getElementById('thumb-' + siteID);
  if (el) el.innerHTML = `<img src="data:image/png;base64,${b64}" />`;
}
async function loadThumb(siteID, path) {
  if (shotCache[path]) { setThumb(siteID, shotCache[path]); return; }
  try {
    const b64 = await go.GetScreenshot(path);
    shotCache[path] = b64;
    setThumb(siteID, b64);
  } catch(e) { /* 忽略截图加载失败 */ }
}

/* ---------- 导出 ---------- */
async function exportTask(taskID) {
  try {
    const path = await go.ExportTask(taskID);
    toast('已导出: ' + path);
  } catch(e) { toast('导出失败: ' + e, true); }
}

/* ---------- 添加任务 ---------- */
function isIPTarget(t) {
  return /^\d{1,3}(\.\d{1,3}){3}(\/\d{1,2})?$/.test(t) || t.includes(':');
}
function splitTargets(text) {
  return text.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
}
function updateTypeHint() {
  const targets = splitTargets(document.getElementById('mTarget').value);
  const hint = document.getElementById('typeHint');
  if (!targets.length) { hint.style.display = 'none'; return; }
  const domains = targets.filter(t => !isIPTarget(t));
  const ips = targets.filter(t => isIPTarget(t));
  hint.style.display = '';
  let msg = '';
  if (domains.length) msg += domains.length + ' 个域名';
  if (ips.length) msg += (msg ? '，' : '') + ips.length + ' 个 IP';
  hint.textContent = '识别：' + msg + '（域名拆多个任务，IP 合并一个任务）';
}
function openAddTask() { document.getElementById('modal').classList.add('show'); }
function closeAddTask() { document.getElementById('modal').classList.remove('show'); }
function togglePortSpec() {
  document.getElementById('mPortSpecWrap').style.display = document.getElementById('mPort').value === 'custom' ? '' : 'none';
}
function toggleCfgPortSpec() {
  document.getElementById('cfgPortSpecWrap').style.display = document.getElementById('cfgPortMode').value === 'custom' ? '' : 'none';
}
async function submitTask() {
  const targets = splitTargets(document.getElementById('mTarget').value);
  if (!targets.length) { toast('请输入目标', true); return; }
  const btn = document.getElementById('mSubmit');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const domains = targets.filter(t => !isIPTarget(t));
    const ips = targets.filter(t => isIPTarget(t));
    const portMode = document.getElementById('mPort').value;
    const portSpec = document.getElementById('mPortSpec').value.trim();
    if (portMode === 'custom' && !portSpec) { toast('请填写自定义端口（如 1-1000,8080）', true); return; }
    const base = {
      port_mode: portMode,
      port_spec: portSpec,
      brute: document.getElementById('mBrute').checked,
      no_ping: document.getElementById('mNoPing').checked,
      nuclei: document.getElementById('mNuclei').checked,
      file_leak: document.getElementById('mLeak').checked,
      screenshot: document.getElementById('mShot').checked,
    };
    let count = 0;
    // 域名：每个一个独立任务
    for (const d of domains) {
      await go.StartScan({ ...base, type: '', target: d });
      count++;
    }
    // IP/网段：合并为一个任务
    if (ips.length) {
      await go.StartScan({ ...base, type: 'ip', target: ips.join(',') });
      count++;
    }
    closeAddTask();
    toast('已提交 ' + count + ' 个任务');
    renderHome();
  } catch(e) { toast('提交失败: ' + e, true); }
  finally { btn.disabled = false; btn.textContent = '开始侦察'; }
}

/* ---------- 配置 ---------- */
async function openConfig() {
  document.getElementById('configModal').classList.add('show');
  try {
    const cfg = await go.GetConfig();
    document.getElementById('cfgLeakDict').value = (cfg.file_leak && cfg.file_leak.dict_path) || '';
    document.getElementById('cfgTemplatesDir').value = (cfg.nuclei && cfg.nuclei.templates_dir) || '';
    document.getElementById('cfgNucleiAuto').checked = !!(cfg.nuclei && cfg.nuclei.auto_download);
    document.getElementById('cfgNucleiRepo').value = (cfg.nuclei && cfg.nuclei.templates_repo) || '';
    document.getElementById('cfgSubfinderConfig').value = (cfg.subfinder && cfg.subfinder.provider_config) || '';
    document.getElementById('cfgConcurrency').value = (cfg.scan && cfg.scan.concurrency) || 100;
    document.getElementById('cfgTimeout').value = (cfg.scan && cfg.scan.timeout_sec) || 5;
    document.getElementById('cfgPortMode').value = (cfg.scan && cfg.scan.default_port_mode) || 'top1000';
    document.getElementById('cfgPortSpec').value = (cfg.scan && cfg.scan.default_port_spec) || '';
    toggleCfgPortSpec();
    document.getElementById('cfgChrome').value = (cfg.screenshot && cfg.screenshot.chrome_path) || '';
    document.getElementById('cfgNmap').value = (cfg.scan && cfg.scan.nmap_path) || '';
    document.getElementById('cfgMasscan').value = (cfg.scan && cfg.scan.masscan_path) || '';
    document.getElementById('cfgProxy').value = (cfg.proxy && cfg.proxy.http_url) || '';
    document.getElementById('cfgPath').textContent = await go.ConfigPath();
  } catch(e) { toast('加载配置失败: ' + e, true); }
}
function closeConfig() { document.getElementById('configModal').classList.remove('show'); }
async function saveConfig() {
  const cfg = await go.GetConfig();
  cfg.file_leak = cfg.file_leak || {}; cfg.file_leak.dict_path = document.getElementById('cfgLeakDict').value.trim();
  cfg.nuclei = cfg.nuclei || {};
  cfg.nuclei.templates_dir = document.getElementById('cfgTemplatesDir').value.trim();
  cfg.nuclei.auto_download = document.getElementById('cfgNucleiAuto').checked;
  cfg.nuclei.templates_repo = document.getElementById('cfgNucleiRepo').value.trim();
  cfg.subfinder = cfg.subfinder || {}; cfg.subfinder.provider_config = document.getElementById('cfgSubfinderConfig').value.trim();
  cfg.scan = cfg.scan || {};
  cfg.scan.concurrency = parseInt(document.getElementById('cfgConcurrency').value) || 100;
  cfg.scan.timeout_sec = parseInt(document.getElementById('cfgTimeout').value) || 5;
  cfg.scan.default_port_mode = document.getElementById('cfgPortMode').value;
  cfg.scan.default_port_spec = document.getElementById('cfgPortSpec').value.trim();
  cfg.scan.nmap_path = document.getElementById('cfgNmap').value.trim();
  cfg.scan.masscan_path = document.getElementById('cfgMasscan').value.trim();
  cfg.screenshot = cfg.screenshot || {}; cfg.screenshot.chrome_path = document.getElementById('cfgChrome').value.trim();
  cfg.proxy = cfg.proxy || {}; cfg.proxy.http_url = document.getElementById('cfgProxy').value.trim();
  try { await go.SaveConfig(cfg); closeConfig(); toast('配置已保存'); }
  catch(e) { toast('保存失败: ' + e, true); }
}
async function openSubfinderConfig() {
  try {
    const path = await go.OpenSubfinderProviderConfig();
    document.getElementById('cfgSubfinderConfig').value = path;
    toast('已打开: ' + path);
  } catch(e) { toast('打开失败: ' + e, true); }
}

  try {

      document.getElementById('cfgChrome').value = path;

async function detectNmap() {
  try {
    const path = await go.DetectNmapPath();
    if (path) {
      document.getElementById('cfgNmap').value = path;
      toast('已探测到: ' + path);
    } else {
      toast('未找到 nmap，请手动填写路径', true);
    }
  } catch(e) { toast('探测失败: ' + e, true); }
}
async function detectMasscan() {
  try {
    const path = await go.DetectMasscanPath();
    if (path) {
      document.getElementById('cfgMasscan').value = path;
      toast('已探测到: ' + path);
    } else {
      toast('未找到 masscan，请手动填写路径', true);
    }
  } catch(e) { toast('探测失败: ' + e, true); }
}
async function downloadNuclei(btn) {
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '下载中…';
  try {
    const dest = await go.DownloadNucleiTemplates();
    document.getElementById('cfgTemplatesDir').value = dest;

/* ---------- 顶栏状态与操作 ---------- */
function setTopbar(view) {
  document.getElementById('backBtn').style.display = (view === 'home') ? 'none' : '';
  document.getElementById('searchBox').style.display = (view === 'detail') ? 'none' : '';
  document.getElementById('addBtn').style.display = (view === 'home') ? '' : 'none';
  document.getElementById('exportBtn').style.display = (view === 'detail') ? '' : 'none';
}
function goHome() { renderHome(); }
function openURL(url) {
  try {
    window.runtime.BrowserOpenURL(url);
  } catch(e) {
    toast('打开浏览器失败: ' + e, true);
  }
}
async function rescanTask(id) {
  try {
    await go.RescanTask(id);
    toast('已重新提交扫描');
    renderHome();
  } catch(e) { toast('重新扫描失败: ' + e, true); }
}
async function pauseTask(id) {
  try {
    await go.PauseTask(id);
    toast('任务已中止（暂停）');
    renderHome();
  } catch(e) { toast('中止失败: ' + e, true); }
}
async function resumeTask(id) {
  try {
    await go.ResumeTask(id);
    toast('任务已恢复');
    renderHome();
  } catch(e) { toast('恢复失败: ' + e, true); }
}
let pendingDeleteID = null;
function delTask(id) {
  pendingDeleteID = id;
  document.getElementById('deleteModal').classList.add('show');
}
async function confirmDelete() {
  if (!pendingDeleteID) return;
  const id = pendingDeleteID;
  pendingDeleteID = null;
  document.getElementById('deleteModal').classList.remove('show');
  try { await go.DeleteTask(id); toast('已删除'); renderHome(); }
  catch(e) { toast('删除失败: ' + e, true); }
}
function cancelDelete() {
  pendingDeleteID = null;
  document.getElementById('deleteModal').classList.remove('show');
}
async function exportCurrent() {
  if (state.taskID) await exportTask(state.taskID);
}

/* ---------- 轮询 ---------- */
async function poll() {
  if (state.view === 'home') { renderHome(); }
  else if (state.view === 'detail' && state.taskID) {
    const t = await go.GetTask(state.taskID).catch(()=>null);
    if (t && t.status !== state.lastStatus) {
      state.lastStatus = t.status;
      renderDetail(state.taskID);
    }
  }
}

function cancelClose() {
  document.getElementById('closeModal').classList.remove('show');
}
async function confirmClose() {
  document.getElementById('closeModal').classList.remove('show');
  try { await go.ForceClose(); } catch(e) {}
  window.runtime.Quit();
}
window.runtime.EventsOn("close:confirm", () => {
  document.getElementById('closeModal').classList.add('show');
});

renderHome();
setInterval(poll, 2500);
</script>
